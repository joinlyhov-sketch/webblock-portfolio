    post:
      operationId: ui_redeploy_release
      tags: [ui]
      summary: Admin redeploy of the live release
      description: |
        Accepts a redeploy of the project's live release and answers the bare `CommandAccepted`.
        - It runs the operation `redeploy_release`: the same checks, errors, idempotency and audit event.
        - Only a caller whose roles hold `ADMIN` may call it, on any project, without the project
          access check; anyone else is `403 ACCESS_DENIED` before anything is stored.
        - Takes no request body: a body must be absent, empty, or the empty JSON object.
        - `409 COMMAND_IN_PROGRESS`: another command of the project is in flight.
        - `422 ROUTE_NOT_STABLE`: the route is not stable.
        - `422 REDEPLOY_NOT_ALLOWED`: the project has no live release (or no site), or hosting is offline.
        - See FR-61.
