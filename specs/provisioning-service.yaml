      description: |
        Returns the bare `SiteStatus` of the project.
        - `online` is true only when hosting is online and a live release exists.
        - A project before its first release answers 200 with `online` false.
        - `uptimePercent` and `checkedAt` are null: nothing probes the site.
        - A project the caller cannot access is a `404 PROJECT_NOT_FOUND`, like every read.
