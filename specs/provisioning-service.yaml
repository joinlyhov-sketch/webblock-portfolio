openapi: 3.0.3
info:
  title: WebBlock Provisioning API
  version: 0.2.0
  description: >-
    Draft contract for the REST surface that Provisioning owns. The paths
    and the revision 16 amendments are decision 0006 sections 2 and 3, and
    version 0.2.0 is the one breaking
    release of decision 0023 (G1 to G7). A release is created from the Project
    service's "source published" event and its build starts automatically, so
    no operation creates a release. The build operation (decision 0014) only
    starts or retries the build of an existing release. Hosting is suspended and
    resumed from Payment's and Project's events, and by platform staff through
    the four admin operations under /v1/admin/projects/{projectId} (decision
    0023 G9 to G13): suspend and resume a site, redeploy its live release, and
    read its commands with their requester. Only a caller holding the ADMIN
    role takes them, on any project, without the project access check. The
    rollback of an uncertain route (FR-50) keeps its path under /v1/projects
    and is ADMIN only in the same way. An ADMIN also gets the owner reads of
    any project (the release, command, deployment, diagnostics and listing
    reads, and the /v1/ui project reads) without the project access check;
    build, deploy and promote keep it for an ADMIN (FR-51). Source
    repository, commit, image, namespace and hostname always come from trusted
    records and are never accepted from the caller. The two listing reads
    (decision 0014 section 21 ruling 7) page through a project's releases and
    commands with limit and cursor; they add no mutation. Every success is the
    envelope of Notion 2.1 (success, data, meta; decision 0023 G2), served as
    application/json; every error is a Problem (decision 0023 G5). Every name
    a client sees (body fields, path and query parameters) is camelCase; the
    values of enums and failure codes are unchanged (G3). The response shapes
    are Provisioning's draft and have not been reviewed by their consumers
    (open decision OD-25). The /v1/ui routes serve the web app's server:
    they answer the bare object or a numbered Page with no envelope, take
    page, size and sort, and have no MCP tool (FR-57). Two of them read a
    site's access lines and live counts from Loki (FR-63).
  x-status: draft
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: releases
    description: Build, deploy and promote a release, and read releases and their diagnostics.
  - name: commands
    description: Read the commands of a project and their outcome.
  - name: deployment
    description: Read the live and candidate deployment of a project.
  - name: admin
    description: ADMIN only. Roll back, suspend, resume and redeploy a site, and read its commands.
  - name: ui
    description: The web app's reads under /v1/ui. Bare answers and numbered pages; REST only.
paths:
  /v1/projects/{projectId}/releases/{releaseId}/deploy:
    post:
      operationId: deploy_release
      tags: [releases]
      summary: Accept private candidate deployment
      description: |
        Accepts a private candidate deployment of a built release. Public traffic does not move.
        - Takes no request body: a body must be absent, empty, or the empty JSON object.
        - `409 COMMAND_IN_PROGRESS`: another command of the project is in flight.
        - `422` when:
          - the route is not stable;
          - hosting is offline;
          - the release is not built;
          - the release was created before the live release.
      parameters:
        - $ref: '#/components/parameters/RequestIdIn'
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ReleaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          description: Durably accepted. data is the accepted command; poll its statusUrl for progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAcceptedResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }
  /v1/projects/{projectId}/releases/{releaseId}/promote:
    post:
      operationId: promote_release
      tags: [releases]
      summary: Accept route promotion
      description: |
        Accepts promotion of a `candidate_ready` release by changing route intent.
        - If the promotion fails, the same command restores the route to the project's live release.
        - Takes no request body: a body must be absent, empty, or the empty JSON object.
        - `409 COMMAND_IN_PROGRESS`: another command of the project is in flight.
        - `422` when:
          - the route is not stable;
          - hosting is offline;
          - the release is not `candidate_ready`;
          - the release was created before the live release.
      parameters:
        - $ref: '#/components/parameters/RequestIdIn'
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ReleaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          description: Durably accepted. data is the accepted command; poll its statusUrl for progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAcceptedResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }
  /v1/projects/{projectId}/releases/{releaseId}/rollback:
    post:
      operationId: rollback_release
      tags: [admin]
      summary: Operator recovery of an uncertain route to the live release or the offline page
      description: |
        Operator recovery of an uncertain route.
        - Accepted only when the project's `routingStatus` is `uncertain`, the state a failed or
          unverified route change leaves behind.
        - The path names the release that is still promoting.
        - The route is restored to the project's live release (`liveReleaseId`), or to the offline page
          when `hostingStatus` is `offline` or the project has no live release.
        - The route is never restored to a release chosen by the caller.
        - It is not a way to leave a healthy live release: with any other routing status the request is a
          `422 RELEASE_STATE_INVALID`.
        - Takes no request body: a body must be absent, empty, or the empty JSON object.
        - Entitlement is not consulted, so recovery is never blocked by an expired plan and
          `PUBLISH_LIMIT_REACHED` never answers it.
        - Only a caller whose roles hold `ADMIN` (exactly, case-sensitive) may call it, on any
          project, without the project access check.
        - Anyone else, the project's owner included, is `403 ACCESS_DENIED` before the project is looked at.
        - The command records the admin's subject.
        - The production profile refuses it with `503 OPERATION_UNAVAILABLE`, as every mutation.
        - An ADMIN reads any project on the owner reads, without the project access check, so the
          returned status URL (get_command) and get_deployment answer the admin who does not own the
          project too.
        - See FR-50, FR-51 and decision 0019 section 7.
      parameters:
        - $ref: '#/components/parameters/RequestIdIn'
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ReleaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          description: Durably accepted. data is the accepted command; poll its statusUrl for progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAcceptedResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }
  /v1/projects/{projectId}/releases/{releaseId}:
    get:
      operationId: get_release
      tags: [releases]
      summary: Read release and step status
      description: Returns the persisted release with its steps.
      parameters:
        - $ref: '#/components/parameters/RequestIdIn'
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ReleaseId'
      responses:
        '200':
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          description: Persisted state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ReadConflict' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }
  /v1/projects/{projectId}/commands/{commandId}:
    get:
      operationId: get_command
      tags: [commands]
      summary: Read accepted command progress
      description: |
        Returns the persisted command.
        - Any command of the project can be read.
        - This includes a hosting command created from a Payment event, which names no release.
      parameters:
        - $ref: '#/components/parameters/RequestIdIn'
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/CommandId'
      responses:
        '200':
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          description: Persisted state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ReadConflict' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }
  /v1/projects/{projectId}/deployment:
    get:
      operationId: get_deployment
      tags: [deployment]
      summary: Read the live release, routing status and hosting status
      description: |
        Returns the project's stored hosting state.
        - The confirmed live release.
        - The last command number.
        - The routing status and the hosting status.
        - A summary of the command in flight, when there is one.
        - `404 DEPLOYMENT_NOT_FOUND`: a project for which no release was ever accepted has no stored state.
      parameters:
        - $ref: '#/components/parameters/RequestIdIn'
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          description: Persisted state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ReadConflict' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }
  /v1/projects/{projectId}/releases/{releaseId}/diagnostics:
    get:
      operationId: get_release_diagnostics
      tags: [releases]
      summary: Read redacted, bounded diagnostics
      description: |
        Returns what the stored rows say about a release.
        - The release's status and failure code.
        - Its most recent steps (at most 20, with their failure codes and times).
        - The project's most recent commands (at most 10, with their failure codes).
        - The outcome of the "source published" event the release came from.
        - The answer is bounded and redacted: codes, counts and times only, never a build log location, a
          failure text, a repository or a commit.
        - `stepsTruncated` and `commandsTruncated` say whether older rows were left out.
        - See decision 0014 section 21 ruling 6.
      parameters:
        - $ref: '#/components/parameters/RequestIdIn'
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ReleaseId'
      responses:
        '200':
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          description: Redacted, bounded diagnostics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticsResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ReadConflict' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }
  /v1/projects/{projectId}/releases/{releaseId}/build:
    post:
      operationId: build_release
      tags: [releases]
      summary: Start or retry the build of a release (prototype)
      description: |
        Prototype operation: requests the build of a release.
        - Applies to an `accepted` release, or to the next build attempt of a `building` release whose
          last attempt failed while attempts remain.
        - The release's pending build attempt is the durable request: this operation checks it, writes
          nothing, and asks the build worker to start it at once.
        - The build worker alone calls the build system, and starts the attempt after a short grace even
          if that request is lost.
        - It is not a command: no `Idempotency-Key` is taken; the build is tracked through the release
          and its build steps.
        - Accepting a "source published" event starts the first build by itself.
        - A release that has reached `failed` is not rebuilt.
        - Takes no request body: a body must be absent, empty, or the empty JSON object.
        - `422 RELEASE_NOT_BUILDABLE`: the release has no pending build attempt.
        - `409 BUILD_IN_PROGRESS`: an attempt is running.
        - Two requests for the same pending attempt are both accepted and start it once.
        - The 202 body is the release as read when the request was accepted, so its build step may still
          be pending.
        - See decision 0014 section 3 ("Build") and decision 0016 section 5 item 2.
      parameters:
        - $ref: '#/components/parameters/RequestIdIn'
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ReleaseId'
      responses:
        '202':
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          description: The build attempt was requested; the build worker starts it. Read the release for progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/BuildConflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }
  /v1/projects/{projectId}/releases:
    get:
      operationId: list_releases
      tags: [releases]
      summary: List the project's releases, newest first
      description: |
        Pages through the project's releases, newest first (by creation time, then release ID).
        - Each item is a summary without steps; read one release with get_release for its steps.
        - `data` holds the page's releases and `meta.page` its `limit` and `nextCursor`.
        - `nextCursor` is null on the last page; otherwise pass it as `cursor` to read the next page.
        - A project the caller cannot access is a `404 PROJECT_NOT_FOUND`, like every read.
        - A project without releases is an empty page.
      parameters:
        - $ref: '#/components/parameters/RequestIdIn'
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          description: One page of releases.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseListResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ReadConflict' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }
  /v1/projects/{projectId}/commands:
    get:
      operationId: list_commands
      tags: [commands]
      summary: List the project's commands, newest first
      description: |
        Pages through the project's commands, newest first (by command number).
        - Hosting commands created from Payment events are included.
        - `data` holds the page's commands and `meta.page` its `limit` and `nextCursor`.
        - `nextCursor` is null on the last page; otherwise pass it as `cursor` to read the next page.
        - A project the caller cannot access is a `404 PROJECT_NOT_FOUND`, like every read.
        - A project without commands is an empty page.
      parameters:
        - $ref: '#/components/parameters/RequestIdIn'
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          description: One page of commands.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandListResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ReadConflict' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }
  /v1/admin/projects/{projectId}/hosting/suspend:
    post:
      operationId: suspend_website
      tags: [admin]
      summary: Admin suspend of one site
      description: |
        Accepts a suspend of the project's site with the offline reason `admin_suspended`.
        - The command adds only that reason: a site already offline for another reason stays offline and
          keeps its other reasons.
        - Only a caller whose roles hold `ADMIN` (exactly, case-sensitive) may call it, on any
          project, without the project access check.
        - Anyone else is `403 ACCESS_DENIED` before the project is looked at, so the answer is the same
          for every project.
        - The key is stored as `admin:<Idempotency-Key>`, so it never takes a key of a system event.
        - The command records the admin's subject.
        - Takes no request body: a body must be absent, empty, or the empty JSON object.
        - `409 COMMAND_IN_PROGRESS`: another command of the project is in flight.
        - `422 ROUTE_NOT_STABLE`: the route is not stable.
        - The production profile refuses it with `503 OPERATION_UNAVAILABLE`, as every mutation.
        - See decision 0023 G9 to G11.
      parameters:
        - $ref: '#/components/parameters/RequestIdIn'
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/AdminIdempotencyKey'
      responses:
        '202':
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          description: Durably accepted. data is the accepted command.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAcceptedResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }
  /v1/admin/projects/{projectId}/hosting/resume:
    post:
      operationId: resume_website
      tags: [admin]
      summary: Admin resume of one site
      description: |
        Accepts a resume of the project's site.
        - The command removes only the offline reason `admin_suspended`; the site is online again only
          when no other reason is left.
        - It is accepted even when the reason is not there.
        - Only a caller whose roles hold `ADMIN` may call it, on any project, without the project
          access check.
        - Anyone else is `403 ACCESS_DENIED` before the project is looked at.
        - The key is stored as `admin:<Idempotency-Key>`.
        - The command records the admin's subject.
        - Takes no request body: a body must be absent, empty, or the empty JSON object.
        - `409 COMMAND_IN_PROGRESS`: another command of the project is in flight.
        - `422 ROUTE_NOT_STABLE`: the route is not stable.
        - The production profile refuses it with `503 OPERATION_UNAVAILABLE`, as every mutation.
        - See decision 0023 G9 to G11.
      parameters:
        - $ref: '#/components/parameters/RequestIdIn'
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/AdminIdempotencyKey'
      responses:
        '202':
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          description: Durably accepted. data is the accepted command.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAcceptedResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }
  /v1/admin/projects/{projectId}/redeploy:
    post:
      operationId: redeploy_release
      tags: [admin]
      summary: Admin redeploy of the live release
      description: |
        Accepts a redeploy of the project's live release.
        - Its pods restart one by one with the same image.
        - The route, `routingStatus` and the release status do not change.
        - The command names the release that is live when it is accepted.
        - Only a caller whose roles hold `ADMIN` may call it, on any project, without the project
          access check.
        - Anyone else is `403 ACCESS_DENIED` before the project is looked at.
        - The key is in the same key space as deploy, promote and rollback.
        - The command records the admin's subject.
        - Takes no request body: a body must be absent, empty, or the empty JSON object.
        - `409 COMMAND_IN_PROGRESS`: another command of the project is in flight.
        - `422 REDEPLOY_NOT_ALLOWED`: the project has no live release (or no site), or hosting is offline.
        - `422 ROUTE_NOT_STABLE`: the route is not stable.
        - The production profile refuses it with `503 OPERATION_UNAVAILABLE`, as every mutation.
        - See decision 0023 G9 and G12.
      parameters:
        - $ref: '#/components/parameters/RequestIdIn'
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          description: Durably accepted. data is the accepted command.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAcceptedResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
