  /v1/ui/admin/audit:
    get:
      operationId: ui_list_audit_entries
      tags: [ui]
      summary: Page through the audited admin and hosting commands
      description: |
        Returns a bare `Page` of the shared `AuditEntry`, newest `occurredAt` first, ties by ID.
        - One entry per `suspend_hosting`, `resume_hosting`, `rollback` or `redeploy` command of
          any project; deploy and promote commands are not entries.
        - `id` is the command ID, `occurredAt` its creation time, `targetId` its project.
        - `actorUserId` is the Keycloak subject that asked; null when the system asked (Payment,
          the owner status, a project deletion).
        - `result`: `accepted` is `QUEUED`; `failed` and `skipped` are `FAILED`.
        - `action`, `actorUserId` and `since` filter; `totalItems` counts the same.
        - `size` goes up to 200 here, so the web app's server can merge 200 per service.
        - Only a caller whose roles hold `ADMIN` may call it; anyone else is `403 ACCESS_DENIED`
          before any read.
        - See FR-57 and FR-62.
