        - `stage` `LIVE` keeps the projects whose newest release is live, `RELEASE` the others.
        - `totalItems` counts the projects the same filter keeps.
        - Only a caller whose roles hold `ADMIN` may call it; anyone else is `403 ACCESS_DENIED`
